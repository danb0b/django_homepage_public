services:
  django:
    hostname: django
    container_name: django
    image: django_markdown:latest
    env_file: "../my_env.env"
    volumes:
      - ../homepage:/homepage
      - /home/ubuntu/danb0b.github.io:/source
      - ../collected_files:/files
      - ./log:/log
    working_dir: /homepage
    command: bash -c "./run"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        restart: true
        required: true
    networks:
      - caddy_host
      - local
  caddy_host:
    hostname: caddy
    container_name: caddy
    image: django_caddy:latest
    cap_add:
      - NET_ADMIN
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./caddyconf:/etc/caddy
      - ./caddysite:/srv
      - ./caddydata:/data
      - ./caddyconfig:/config
      - ../collected_files:/files
      - ./log:/log
    restart: unless-stopped
    networks:
      - caddy_host
  db:
    hostname: db
    container_name: db
    # image: danb0b/my_maria_db:latest
    image: my_maria_db:latest
    restart: unless-stopped
    volumes:
      - ./mysql:/var/lib/mysql
    env_file: "../my_env.env"
    networks:
    - local
    healthcheck:
      test: mariadb-admin ping -h 127.0.0.1 -u $$MYSQL_USER --password=$$MYSQL_PASSWORD
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 5
networks:
  local:
    driver: bridge
  caddy_host:
    driver: bridge      
